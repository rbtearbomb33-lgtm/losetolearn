<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="输局学习所">
  <meta name="description" content="输一把王者，学习一小时。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=3.6">
  <title>输局学习所</title>
</head>
<body>
  <canvas id="asciiBackground" class="ascii-background" aria-hidden="true"></canvas>
  <div id="sharkGlass" class="shark-glass" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="brand-copy"><span>LOSE TO STUDY</span></div>
      <button id="installHint" class="icon-button" aria-label="添加到主屏幕">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <section class="debt-section" aria-label="待偿还学习时间">
      <div class="section-overline"><span>待偿还</span></div>
      <div class="debt-number"><span id="debtHours">0</span><small>小时</small><span id="debtMinutes">00</span><small>分钟</small></div>
      <div class="progress-track"><div id="debtProgress" class="progress-fill"></div></div>
      <p id="debtCaption" class="microcopy">今天暂时没有学习债务</p>
    </section>

    <section class="rank-section" aria-label="本局段位">
      <div class="section-title-row"><h2>本局段位</h2></div>
      <div class="rank-fields">
        <label class="field"><span>段位</span><select id="rankSelect">
          <option>倔强青铜</option><option>秩序白银</option><option>荣耀黄金</option>
          <option>尊贵铂金</option><option>永恒钻石</option><option>至尊星耀</option>
          <option>最强王者</option><option>无双王者</option><option>荣耀王者</option><option>传奇王者</option>
        </select></label>
        <label class="field division-field"><span>小段</span><select id="divisionSelect">
          <option value="I">一</option><option value="II">二</option><option value="III">三</option><option value="IV">四</option><option value="V">五</option>
        </select></label>
        <label class="field stars-field"><span>星数</span><input id="starInput" type="number" inputmode="numeric" min="0" max="999" value="0"></label>
      </div>
      <div class="rank-confirm-row"><div id="rankCurrent" class="rank-current" hidden></div><button id="confirmRankBtn" class="text-action rank-confirm">确认段位 <span>→</span></button></div>
      <p id="rankHint" class="visually-hidden">每开一局前确认一次。</p>
    </section>

    <section class="focus-section" aria-label="学习计时">
      <div class="section-title-row"><h2>专注时间</h2></div>
      <div class="timer-meta"><strong id="timerDisplay">00:00</strong><span id="timerSub" class="timer-sub">剩余时间</span></div>
      <div class="timer-palette" id="timerPalette" aria-label="计时器配色">
        <button class="swatch active" data-color="#B58D8D" style="--swatch:#B58D8D" aria-label="灰玫瑰"></button>
        <button class="swatch" data-color="#8FA69A" style="--swatch:#8FA69A" aria-label="鼠尾草"></button>
        <button class="swatch" data-color="#91A5B8" style="--swatch:#91A5B8" aria-label="雾霾蓝"></button>
        <button class="swatch" data-color="#B0A0BA" style="--swatch:#B0A0BA" aria-label="灰紫"></button>
        <button class="swatch" data-color="#C3B394" style="--swatch:#C3B394" aria-label="燕麦"></button>
        <button class="swatch" data-color="#777C80" style="--swatch:#777C80" aria-label="石墨"></button>
      </div>
      <div class="timer-art" id="timerArt">
        <svg class="ribbon-dial" viewBox="0 0 360 360" role="img" aria-label="双圈动态丝带计时器">
          <g class="ribbon-ticks" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.4">
            <path d="M180 22v10 M338 180h-10 M180 338v-10 M22 180h10"/>
            <path d="M101 43l5 9 M259 43l-5 9 M317 101l-9 5 M317 259l-9-5 M259 317l-5-9 M101 317l5-9 M43 259l9-5 M43 101l9 5"/>
          </g>
          <g class="ribbon-hour-scale" id="hourScale" fill="none" style="display:none">
            <g class="ribbon-hour-ticks" stroke="currentColor" stroke-linecap="round" stroke-width="2.2">
              <path d="M180 7v9 M329.7 266.5l-7.8-4.5 M30.3 266.5l7.8-4.5"/>
            </g>
            <g class="ribbon-hour-numbers" fill="currentColor">
              <text x="180" y="35" text-anchor="middle">1</text>
              <text x="305" y="253" text-anchor="middle">2</text>
              <text x="55" y="253" text-anchor="middle">3</text>
            </g>
          </g>
          <g class="ribbon-numbers" fill="currentColor">
            <text x="180" y="62" text-anchor="middle">60</text>
            <text x="302" y="187" text-anchor="middle">45</text>
            <text x="180" y="313" text-anchor="middle">30</text>
            <text x="58" y="187" text-anchor="middle">15</text>
          </g>
          <g class="ribbon-strokes" fill="none">
            <path id="ribbonHour" class="ribbon-path ribbon-hour" d="" style="display:none"/>
            <path id="ribbonMinute" class="ribbon-path ribbon-minute" d=""/>
            <path id="ribbonSecond" class="ribbon-path ribbon-second" d=""/>
          </g>
          <circle id="ribbonOrigin" class="ribbon-origin" cx="236" cy="262" r="5"/>
          <circle id="ribbonHourTip" class="ribbon-tip ribbon-hour-tip" cx="0" cy="0" r="4.2" style="display:none"/>
          <circle id="ribbonMinuteTip" class="ribbon-tip ribbon-minute-tip" cx="0" cy="0" r="3.8"/>
          <circle id="ribbonSecondTip" class="ribbon-tip ribbon-second-tip" cx="0" cy="0" r="3.4"/>
        </svg>
      </div>
      <div class="focus-controls">
        <label class="subject-picker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5v16M8 7h8M8 11h6"/></svg><select id="subjectSelect"><option>中国古代文学</option><option>外国文学</option><option>中国当代文学</option><option>文学概论 / 文学理论</option><option>古代汉语</option><option>教育学</option><option>教育心理学</option><option>其他</option></select><span>⌄</span></label>
        <div class="timer-actions">
          <button id="startBtn" class="button primary"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>开始</button>
          <button id="pauseBtn" class="button secondary" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>暂停</button>
          <button id="resetBtn" class="button tertiary" disabled aria-label="结束本轮"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <p class="hint visually-hidden">暂停时不扣时间。</p>
    </section>

    <section class="match-section" aria-label="对局结果">
      <div class="section-title-row"><h2>对局结算</h2><span class="match-symbol" aria-hidden="true">✦</span></div>
      <label class="medal-picker" aria-label="本局表现"><select id="medalSelect" class="medal-select">
        <option value="none">未选择</option><option value="bronze">铜牌</option><option value="silver">银牌 · 5分钟</option><option value="gold">金牌 · 10分钟</option><option value="top">顶级 · 20分钟</option>
      </select></label>
      <p id="matchPrompt" class="visually-hidden">确认段位后登记胜负。</p>
      <div class="match-actions">
        <button id="winBtn" class="result-button win" disabled><span class="result-icon">↗</span><span>胜利</span></button>
        <button id="loseBtn" class="result-button lose" disabled><span class="result-icon">↘</span><span>失败 <small>+60分钟</small></span></button>
      </div>
      <p id="capHint" class="visually-hidden">每日最多新增180分钟。</p>
    </section>

    <section class="stats-section" aria-label="今日统计">
      <div class="section-title-row"><h2>今日数据</h2><button id="clearHistoryBtn" class="text-action">清空</button></div>
      <div class="stats-grid">
        <div class="stat"><span>胜场</span><strong id="winsToday">0</strong></div>
        <div class="stat"><span>败场</span><strong id="lossesToday">0</strong></div>
        <div class="stat"><span>胜率</span><strong id="winRate">—</strong></div>
        <div class="stat"><span>已学习</span><strong id="studiedToday">0分钟</strong></div>
      </div>
    </section>

    <section class="history-section" aria-label="历史记录">
      <div class="section-title-row"><h2>最近记录</h2></div>
      <div id="historyList" class="history-list"><p class="empty">暂无记录</p></div>
    </section>
    <footer>本地保存 · 今日债务上限 3 小时</footer>
  </main>

  <dialog id="messageDialog" class="message-dialog"><div class="dialog-content">
    <div class="dialog-emoji" id="dialogEmoji">✦</div><h2 id="dialogTitle">提示</h2><p id="dialogText"></p>
    <button id="dialogClose" class="button primary">好</button>
  </div></dialog>
  <script type="module" src="./ascii-bg.js?v=3.6"></script>
  <script src="./dial.js"></script>
  <script src="./app.js"></script>
</body>
</html>
